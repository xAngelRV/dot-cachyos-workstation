font_family JetBrainsMono Nerd Font
font_size 11.0
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0

background_opacity 0.85
background_blur 1

foreground #e0def4
background #232136
selection_foreground #e0def4
selection_background #44415a
cursor #ea9a97
cursor_text_color #232136

color0 #393552
color8 #6e6a86
color1 #eb6f92
color9 #eb6f92
color2 #3e8fb0
color10 #3e8fb0
color3 #f6c177
color11 #f6c177
color4 #9ccfd8
color12 #9ccfd8
color5 #c4a7e7
color13 #c4a7e7
color6 #ea9a97
color14 #ea9a97
color7 #e0def4
color15 #e0def4

# --- Pestanas y divisiones (Splits) ---
enabled_layouts splits,stack

# Barra de pestanas minimalista Rose Pine Moon
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #232136
active_tab_background #ea9a97
active_tab_font_style bold
inactive_tab_foreground #908caa
inactive_tab_background #2a273f
tab_bar_background #232136

# Borde sutil entre paneles divididos
window_border_width 1pt
active_border_color #ea9a97
inactive_border_color #393552

# Atajos de pestanas
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Atajos para dividir paneles en la misma carpeta actual
map ctrl+shift+d launch --location=vsplit --cwd=current
map ctrl+shift+e launch --location=hsplit --cwd=current
map ctrl+shift+x close_window

# Moverse entre paneles con Alt + Flechas
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

# Alternar pantalla completa del panel activo (zoom)
map ctrl+shift+z toggle_layout stack

# Redimensionar paneles divididos (Splits)
map ctrl+alt+left resize_window narrower 3
map ctrl+alt+right resize_window wider 3
map ctrl+alt+up resize_window taller 3
map ctrl+alt+down resize_window shorter 3
map ctrl+alt+r resize_window reset
