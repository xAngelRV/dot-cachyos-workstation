context.modules = [
  { name = libpipewire-module-rtp-sink
    args = {
      sess.name = "Scream"
      destination.ip = "192.168.100.11"
      destination.port = 4010
      audio.format = "S16BE"
      audio.rate = 48000
      audio.channels = 2
      rtp.payload = 127
      rtp.ptime = 5
      stream.props = {
        node.name = "scream-rtp-out"
        target.object = "scream-virtual-sink"
        stream.capture.sink = true
        node.autoconnect = true
      }
    }
  }
]

context.objects = [
  { factory = adapter
    args = {
      factory.name = support.null-audio-sink
      node.name = "scream-virtual-sink"
      node.description = "Parlantes PC Windows"
      media.class = Audio/Sink
      object.linger = true
      monitor.channel-volumes = true
      audio.position = [ FL FR ]
    }
  }
]
