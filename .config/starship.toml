add_newline = true

format = "$directory$git_branch$git_status$nodejs$python$java$c$cmd_duration$line_break$character"

[directory]
style = "#c4a7e7"
truncation_length = 3
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "#ea9a97"
format = "[$symbol$branch]($style) "

[git_status]
style = "#eb6f92"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
style = "#f6c177"
format = "[ $duration]($style) "

[character]
success_symbol = "[❯](#ea9a97)"
error_symbol = "[❯](#eb6f92)"

[nodejs]
symbol = " "
style = "#9ccfd8"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "#f6c177"
format = "[$symbol($version )]($style)"

[java]
symbol = " "
style = "#ea9a97"
format = "[$symbol($version )]($style)"

[c]
symbol = " "
style = "#3e8fb0"
format = "[$symbol($version )]($style)"
