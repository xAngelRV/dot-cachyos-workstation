add_newline = false

[directory]
style = "bold #89b4fa"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold #cba6f7"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #f38ba8"
format = "([$all_status$ahead_behind]($style) )"

[nodejs]
symbol = " "
style = "bold #a6e3a1"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold #f9e2af"
format = "via [$symbol$pyenv_prefix($version )($virtualenv )]($style)"

[java]
symbol = " "
style = "bold #fab387"
format = "via [$symbol($version )]($style)"

[c]
symbol = " "
style = "bold #74c7ec"
format = "via [$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
style = "bold #f5c2e7"
format = "took [$duration]($style) "
